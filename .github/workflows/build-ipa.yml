name: Build unsigned IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26
    env:
      HOMEBREW_NO_REQUIRE_TAP_TRUST: "1"
      HOMEBREW_NO_AUTO_UPDATE: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: |
          set -e
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew trust aws/tap 2>/dev/null || true
            brew install xcodegen
          fi
          xcodegen --version

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build unsigned app
        run: |
          xcodebuild \
            -project JITInfo.xcodeproj \
            -scheme JITInfo \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R "build/Build/Products/Release-iphoneos/JITInfo.app" Payload/
          zip -qry JITInfo.ipa Payload

      - name: Verify widget extension in IPA
        run: |
          rm -rf ipa_check
          mkdir ipa_check
          unzip -q JITInfo.ipa -d ipa_check
          APPEX="ipa_check/Payload/JITInfo.app/PlugIns/JITInfoWidget.appex"
          if [ ! -d "$APPEX" ]; then
            echo "ERROR: JITInfoWidget.appex missing from IPA (PlugIns/)" >&2
            exit 1
          fi
          echo "==> Appex found, contents:"
          ls -la "$APPEX"
          echo "==> NSExtension point:"
          /usr/libexec/PlistBuddy -c "Print :NSExtension:NSExtensionPointIdentifier" "$APPEX/Info.plist"
          echo "==> Appex entitlements (as embedded in code signature):"
          codesign -d --entitlements :- "$APPEX" 2>&1 || echo "(not signed)"
          echo "OK: Widget extension embedded correctly"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: JITInfo-ipa
          path: JITInfo.ipa
