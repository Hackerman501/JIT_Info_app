name: JITInfo
options:
  minimumXcodeGenVersion: 2.35.0
  projectFormat: xcode15_3
  deploymentTarget:
    iOS: "16.1"
  createIntermediateGroups: true

targets:
  JITInfo:
    type: application
    platform: iOS
    deploymentTarget: "16.1"
    sources:
      - path: JITInfo
        excludes:
          - "Info.plist"
          - "*.entitlements"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jitinfo.debugger
        PRODUCT_NAME: JITInfo
        MARKETING_VERSION: "1.1"
        CURRENT_PROJECT_VERSION: "3"
        GENERATE_INFOPLIST_FILE: false
        INFOPLIST_FILE: JITInfo/Info.plist
        CODE_SIGN_ENTITLEMENTS: JITInfo/JITInfo.entitlements
        CODE_SIGN_STYLE: Automatic
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        ENABLE_PREVIEWS: true
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_EMIT_LOC_STRINGS: false
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/Frameworks"
        SWIFT_OBJC_BRIDGING_HEADER: JITInfo/JITInfo-Bridging-Header.h
    dependencies:
      - target: JITInfoWidget
        embed: true
      - sdk: ActivityKit.framework
        weak: true

  JITInfoWidget:
    type: app-extension
    platform: iOS
    deploymentTarget: "16.1"
    sources:
      - path: JITInfoWidget
        excludes:
          - "Info.plist"
          - "*.entitlements"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jitinfo.debugger.widget
        PRODUCT_NAME: JITInfoWidget
        MARKETING_VERSION: "1.1"
        CURRENT_PROJECT_VERSION: "3"
        GENERATE_INFOPLIST_FILE: false
        INFOPLIST_FILE: JITInfoWidget/Info.plist
        CODE_SIGN_ENTITLEMENTS: JITInfoWidget/JITInfoWidget.entitlements
        CODE_SIGN_STYLE: Automatic
        SWIFT_VERSION: "5.0"
        SWIFT_EMIT_LOC_STRINGS: false
        APPLICATION_EXTENSION_API_ONLY: YES
        TARGETED_DEVICE_FAMILY: "1,2"
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/Frameworks"
          - "@executable_path/../../Frameworks"
    dependencies:
      - sdk: ActivityKit.framework
        weak: true
