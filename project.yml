name: JITInfo
options:
  minimumXcodeGenVersion: 2.30.0
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true

targets:
  JITInfo:
    type: application
    platform: iOS
    deploymentTarget: "15.0"
    sources:
      - path: JITInfo
        excludes:
          - "Info.plist"
          - "*.entitlements"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jitinfo.debugger
        PRODUCT_NAME: JITInfo
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: false
        INFOPLIST_FILE: JITInfo/Info.plist
        CODE_SIGN_ENTITLEMENTS: JITInfo/JITInfo.entitlements
        CODE_SIGN_STYLE: Automatic
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        ENABLE_PREVIEWS: true
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_EMIT_LOC_STRINGS: false
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/Frameworks"
        SWIFT_OBJC_BRIDGING_HEADER: JITInfo/JITInfo-Bridging-Header.h
